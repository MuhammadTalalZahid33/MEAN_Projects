<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <h2>Login Form</h2>
    <label for="email"></label>
    <input type="text" id="email" placeholder="Enter email" formControlName="email">
    <div class="error" *ngIf="f['email'].invalid && f['email'].touched">
        <small *ngIf="f['email'].errors?.['required']">Email is required</small>
    </div>

    <label for="password"></label>
    <div class="password-wrapper">
        <input [type]="showPassword ? 'text' : 'password'" id="password" placeholder="Enter password"
            formControlName="password">

        <span class="toggle-eye" (click)="togglePassword()">
            {{ showPassword ? '😑' : '👀' }}
        </span>
    </div>
    <div class="error" *ngIf="f['password'].invalid && f['password'].touched">
        <small *ngIf="f['password'].errors?.['required']">password is required</small>
        <small *ngIf="f['password'].errors?.['minlength']">password should have minimum length of 4</small>
        <small *ngIf="f['password'].errors?.['maxlength']">password should have maximum length of 8</small>
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Submit</button>
    <p>If you don't have account, move to <a (click)="toRegister()">Register</a> page</p>

</form>
