<h2 mat-dialog-title>{{ isEdit ? 'Edit Project' : 'Add Project' }}</h2>

<mat-dialog-content class="dialog-content">
<form [formGroup]="projectForm" mat-dialog-content>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Project Name</mat-label>
        <input matInput formControlName="name" placeholder="Enter project name" required />

        <mat-error *ngIf="f['name'].hasError('required')">
            Project name is required
        </mat-error>

        <mat-error *ngIf="f['name'].hasError('minlength')">
            Project name must be at least 3 characters
        </mat-error>

        <mat-error *ngIf="f['name'].hasError('maxlength')">
            Project name cannot exceed 30 characters
        </mat-error>
    </mat-form-field>


    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" formControlName="description" placeholder="Enter description"></textarea>
    </mat-form-field>

    <!-- <mat-form-field appearance="outline" class="full-width">
    <mat-label>Manager</mat-label>
    <mat-select formControlName="manager_id" placeholder="Select manager">
      <mat-option *ngFor="let user of data.managers" [value]="user.id">
        {{ user.name }}
      </mat-option>
    </mat-select>
    <div class="error" *ngIf="f['manager_id'].invalid && f['manager_id'].touched">
      <small>Manager selection is required</small>
    </div>
  </mat-form-field> -->

    <div class="date-row">
        <mat-form-field appearance="outline" class="date-field">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="start_date" placeholder="Choose start date">
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" class="date-field">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="end_date" placeholder="Choose end date">
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status" placeholder="Select status">
            <mat-option value="active">Active</mat-option>
            <mat-option value="completed">Completed</mat-option>
        </mat-select>
        <div class="error" *ngIf="f['status'].invalid && f['status'].touched">
            <small>Status selection is required</small>
        </div>
    </mat-form-field>
</form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" (click)="submit(projectForm)" [disabled]="projectForm.invalid">
        {{ isEdit ? 'Update' : 'Create' }}
    </button>
</mat-dialog-actions>
